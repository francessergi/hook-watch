services:
  postgres:
    image: postgres:16-alpine
    container_name: hookwatch-postgres
    environment:
      POSTGRES_DB: hookwatch
      POSTGRES_USER: hookwatch
      POSTGRES_PASSWORD: hookwatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookwatch -d hookwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: hookwatch-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    container_name: hookwatch-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql://hookwatch:hookwatch@postgres:5432/hookwatch?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: amqp://guest:guest@rabbitmq:5672/%2f
      DEFAULT_URI: http://localhost:8000
      APP_ENV: dev
      APP_SECRET: dev-secret-change-me
    ports:
      - "8000:8000"
    command: php -S 0.0.0.0:8000 -t public

  worker:
    build:
      context: ./api
    container_name: hookwatch-worker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql://hookwatch:hookwatch@postgres:5432/hookwatch?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: amqp://guest:guest@rabbitmq:5672/%2f
      APP_ENV: dev
      APP_SECRET: dev-secret-change-me
    command: php bin/console messenger:consume async -vv

volumes:
  postgres_data:
